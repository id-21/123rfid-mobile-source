org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
# Converts old android.support.* libraries (e.g. PhotoView 2.0.0) to AndroidX, avoiding duplicate classes
android.enableJetifier=true
# Zebra's code was written before AGP's non-transitive R default
android.nonTransitiveRClass=false
# Zebra's code uses R.id.* in switch/case, which needs compile-time constants
android.nonFinalResIds=false
