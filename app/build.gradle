apply plugin: 'com.android.application'

android {
    compileSdk = 36
    namespace 'com.zebra.demo'

    defaultConfig {
        // Different from Zebra's id so it installs next to the Play Store 123RFID app
        applicationId 'com.dagawallpapers.fulfilment'
        minSdkVersion 29
        targetSdkVersion 36
        versionCode System.getenv("VERSION_CODE") ? System.getenv("VERSION_CODE").toInteger() : 1
        versionName System.getenv("VERSION_NAME") ? System.getenv("VERSION_NAME").toString() : "0.1.0"
        vectorDrawables.useSupportLibrary = true
    }

    buildFeatures {
        // Zebra's code references BuildConfig.DEBUG
        buildConfig = true
    }

    buildTypes {
        release {
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Add your own signingConfig here when you publish a release build
        }
        debug {
            // debug builds are signed automatically with Android Studio's debug key
        }
    }

    compileOptions {
        sourceCompatibility = 1.8
        targetCompatibility = 1.8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation 'com.github.chrisbanes:PhotoView:2.0.0'
    implementation 'androidx.navigation:navigation-fragment:2.9.7'
    implementation 'androidx.navigation:navigation-ui:2.9.7'
    implementation "androidx.recyclerview:recyclerview:1.4.0"
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'com.google.code.gson:gson:2.13.2'
    implementation 'androidx.camera:camera-view:1.6.0'
    implementation "androidx.camera:camera-camera2:1.6.0"
    implementation 'androidx.camera:camera-lifecycle:1.6.0'
    implementation 'com.google.android.gms:play-services-mlkit-barcode-scanning:18.3.1'
    implementation 'org.apache.commons:commons-lang3:3.20.0'
    implementation 'commons-io:commons-io:2.21.0'
    implementation 'net.lingala.zip4j:zip4j:2.11.6'
    implementation 'com.google.guava:guava:33.3.0-android'
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'], exclude: [])

    testImplementation 'junit:junit:4.13.2'
}
